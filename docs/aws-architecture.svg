<svg width="1500" height="820" viewBox="0 0 1500 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10V0Z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1500" height="820" fill="#F8FAFC"/>

  <text x="750" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#0F172A">FinVault AWS Architecture</text>

  <g filter="url(#shadow)">
    <rect x="70" y="320" width="200" height="120" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="360" y="320" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="670" y="320" width="250" height="120" rx="20" fill="#0F172A"/>
    <rect x="1040" y="180" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="1040" y="470" width="220" height="120" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="1330" y="320" width="110" height="120" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <g>
    <text x="170" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Frontend</text>
    <text x="170" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748B">React / Browser</text>

    <text x="470" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Amazon Cognito</text>
    <text x="470" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748B">User Pool</text>

    <text x="795" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">FinVault API</text>
    <text x="795" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#CBD5E1">Spring Boot</text>

    <text x="1150" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Amazon RDS</text>
    <text x="1150" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">PostgreSQL</text>
    <text x="1150" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748B">fin-vault-database</text>

    <text x="1150" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Amazon S3</text>
    <text x="1150" y="544" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">fin-vault-project</text>

    <text x="1385" y="370" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">User</text>
    <text x="1385" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748B">Authenticated</text>
  </g>

  <g stroke="#475569" stroke-width="2.8" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M270 380H360"/>
    <path d="M580 380H670"/>
    <path d="M920 380H1330"/>
    <path d="M920 380V240H1040"/>
    <path d="M920 380V530H1040"/>
  </g>

  <g fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">
    <text x="300" y="366">Login</text>
    <text x="600" y="366">JWT</text>
    <text x="1017" y="366">API requests</text>
    <text x="958" y="256">Metadata</text>
    <text x="958" y="516">Files + URLs</text>
  </g>

  <g>
    <text x="315" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Flow:</text>
    <text x="375" y="616" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">Frontend authenticates with Cognito → API validates token → API stores metadata in RDS → uploads/reads files in S3 → user receives presigned URL</text>
  </g>
</svg>
